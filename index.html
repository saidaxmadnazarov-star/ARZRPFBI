<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FBI Winslow [14] Portal</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#edf3f8;font:14px Arial,sans-serif}button,input,textarea,select{font:inherit}
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#142b47,#070b12 55%)}.loginbox{width:min(420px,90%);background:#0e1621;border:1px solid #2a3c52;border-radius:16px;padding:32px;box-shadow:0 20px 80px #0008}.logo{text-align:center;font-size:22px;font-weight:800;letter-spacing:1px}.seal{width:70px;height:70px;border:2px solid #4276aa;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;color:#7ebcff;font-weight:900}.muted{color:#91a0b3}input,textarea,select{width:100%;padding:12px;margin:7px 0;background:#09111a;color:#fff;border:1px solid #30445c;border-radius:8px}button{cursor:pointer}.primary{width:100%;padding:12px;margin-top:8px;background:#246fca;color:#fff;border:0;border-radius:8px;font-weight:700}.error{color:#ff8e8e;margin-top:10px;min-height:18px}
.app{display:none;min-height:100vh}.top{height:64px;background:#0b121c;border-bottom:1px solid #223043;display:flex;align-items:center;padding:0 3%;gap:20px;position:sticky;top:0;z-index:10}.brand{font-weight:800}.user{margin-left:auto;color:#aebbd0}.logout{background:#111b28;border:1px solid #30445c;color:#fff;padding:8px 12px;border-radius:7px}.layout{display:flex;min-height:calc(100vh - 64px)}aside{width:245px;background:#0a1018;border-right:1px solid #1e2c3d;padding:16px 10px}.navbtn{display:block;width:100%;text-align:left;background:transparent;border:0;color:#aebbd0;padding:11px 12px;border-radius:7px;margin:2px 0}.navbtn:hover,.navbtn.active{background:#17283b;color:#fff}.navgroup{font-size:10px;color:#63748a;margin:18px 12px 6px;text-transform:uppercase;letter-spacing:1px}main{flex:1;padding:30px;max-width:1200px}.page h1{margin-top:0;font-size:30px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card,.record{background:#0e1621;border:1px solid #223043;border-radius:12px;padding:18px}.record{margin:10px 0}.record h3{margin:0 0 8px}.tag{font-size:11px;color:#76b6f8;border:1px solid #315273;border-radius:12px;padding:4px 8px;display:inline-block}.adminbox{margin-top:20px;padding:18px;background:#0c1420;border:1px solid #26384d;border-radius:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{background:#4a1e25;color:#fff;border:0;padding:7px 10px;border-radius:6px}.empty{padding:30px;text-align:center;color:#718196}
@media(max-width:800px){aside{width:60px}aside .label,.navgroup{display:none}.navbtn{text-align:center;font-size:0}.navbtn::first-letter{font-size:18px}.top .user{display:none}.cards,.grid2{grid-template-columns:1fr}main{padding:20px}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="seal">FBI</div><div class="logo">WINSLOW [14]</div><p class="muted" style="text-align:center">Закрытый RP-портал подразделения</p><input id="li" placeholder="Логин"><input id="lp" type="password" placeholder="Пароль"><button class="primary" onclick="login()">Войти</button><div id="err" class="error"></div></div></div>
<div id="app" class="app"><header class="top"><div class="brand">FBI • ARIZONA • WINSLOW [14]</div><div class="user" id="who"></div><button class="logout" onclick="logout()">Выйти</button></header>
<div class="layout"><aside id="nav"></aside><main id="main"></main></div></div>
<script>
const menu=[
["home","🏠","Главная"],["profile","👤","Профиль"],["id","🆔","Рекомендации от ID"],["recruitment","🕵️","Вербовки"],["checks","🏛️","Реестр проверок гос. организаций"],["civilian","👥","Анкеты с гражданки"],["police-ciu","👮","Анкеты полиции / CIU"],["emergency-recruitment","🚨","ЧС вербовок"],["emergency-id","⚠️","ЧС ID"],["news","📰","Новости"]];
let me=null,current="home";
const titles={id:"Рекомендации от ID",recruitment:"Вербовки",checks:"Реестр проверок гос. организаций",civilian:"Анкеты с гражданки","police-ciu":"Анкеты полиции / CIU","emergency-recruitment":"ЧС вербовок","emergency-id":"ЧС ID",news:"Новости"};
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderNav(){nav.innerHTML=`<div class="navgroup">Портал</div>`+menu.map(x=>`<button class="navbtn ${x[0]===current?'active':''}" onclick="go('${x[0]}')">${x[1]} <span class=label>${x[2]}</span></button>`).join("")+(me.role==="admin"?`<div class="navgroup">Администрирование</div><button class="navbtn ${current==="users"?'active':''}" onclick="go('users')">⚙️ <span class=label>Сотрудники</span></button><button class="navbtn ${current==="logs"?'active':''}" onclick="go('logs')">📋 <span class=label>Журнал действий</span></button>`:"")}
async function go(page){current=page;renderNav();if(page==="home")return home();if(page==="profile")return profile();if(page==="users")return users();if(page==="logs")return logs();return records(page)}
function home(){main.innerHTML=`<div class=page><p class=muted>ФЕДЕРАЛЬНОЕ БЮРО РАССЛЕДОВАНИЙ</p><h1>Добро пожаловать, ${esc(me.name)}</h1><div class=cards><div class=card><b>Ваше звание</b><p class=muted>${esc(me.rank)}</p></div><div class=card><b>Роль</b><p class=muted>${me.role==="admin"?"Руководство":"Сотрудник"}</p></div><div class=card><b>Статус портала</b><p style="color:#70d29a">● Система работает</p></div></div></div>`}
function profile(){main.innerHTML=`<div class=page><h1>Профиль</h1><div class=card><h2>${esc(me.name)}</h2><p>Логин: <b>${esc(me.login)}</b></p><p>Звание: <b>${esc(me.rank)}</b></p><p>Уровень доступа: <b>${me.role==="admin"?"Руководство":"Сотрудник"}</b></p></div></div>`}
async function records(type){let d=await fetch("/api/records/"+type).then(r=>r.json());main.innerHTML=`<div class=page><h1>${esc(titles[type])}</h1><p class=muted>Рабочий раздел подразделения</p>${me.role==="admin"?`<div class=adminbox><h3>Добавить запись</h3><div class=grid2><input id=rt placeholder="Заголовок / ID / ФИО"><input id=ra placeholder="Дополнительная информация"></div><textarea id=rb placeholder="Описание"></textarea><button class=primary onclick="addRecord('${type}')">Сохранить запись</button></div>`:""}<div style="margin-top:22px">${d.map(x=>`<article class=record><h3>${esc(x.title)}</h3><p>${esc(x.body)}</p><small class=muted>${esc(x.created)} • ${esc(x.author)}</small>${me.role==="admin"?`<br><button class=danger onclick="delRecord('${type}',${x.id})">Удалить</button>`:""}</article>`).join("")||'<div class=empty>Записей пока нет.</div>'}</div></div>`}
async function addRecord(type){let body=(ra.value?ra.value+"\\n":"")+rb.value;await fetch("/api/records/"+type,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({title:rt.value,body})});go(type)}
async function delRecord(type,id){await fetch(`/api/records/${type}/${id}`,{method:"DELETE"});go(type)}
async function users(){let d=await fetch("/api/users").then(r=>r.json());main.innerHTML=`<div class=page><h1>Сотрудники</h1><div class=adminbox><h3>Создать аккаунт</h3><div class=grid2><input id=ul placeholder="Логин"><input id=up placeholder="Пароль"><input id=un placeholder="Имя"><input id=ur placeholder="Звание"><select id=urole><option value=agent>Сотрудник</option><option value=admin>Руководство</option></select></div><button class=primary onclick="addUser()">Создать</button></div><div style="margin-top:20px">${d.map(x=>`<div class=record><b>${esc(x.name)}</b> — ${esc(x.rank)}<br><span class=muted>${esc(x.login)} • ${x.role}</span> <button class=danger onclick="delUser(${x.id})">Удалить</button></div>`).join("")}</div></div>`}
async function addUser(){await fetch("/api/users",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:ul.value,password:up.value,name:un.value,rank:ur.value,role:urole.value})});users()}
async function delUser(id){await fetch("/api/users/"+id,{method:"DELETE"});users()}
async function logs(){let d=await fetch("/api/logs").then(r=>r.json());main.innerHTML=`<div class=page><h1>Журнал действий</h1>${d.map(x=>`<div class=record><b>${esc(x.login)}</b> — ${esc(x.action)}<br><small class=muted>${esc(x.created)}</small></div>`).join("")}</div>`}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({login:li.value,password:lp.value})});if(!r.ok){err.textContent=(await r.json()).error;return}me=await r.json();login.style.display="none";app.style.display="block";who.textContent=`${me.name} • ${me.rank}`;go("home")}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
(async()=>{let r=await fetch("/api/me");if(r.ok){me=await r.json();login.style.display="none";app.style.display="block";who.textContent=`${me.name} • ${me.rank}`;go("home")}})();
</script></body></html>
